name: generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: whiteherobot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FBBF24&color_dots=#ebedf0,#99f6e4,#2dd4bf,#14b8a6,#0f766e
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FBBF24&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

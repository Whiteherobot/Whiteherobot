name: generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: whiteherobot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3f6665&color_dots=#ebedf0,#c2d6cc,#89b5bc,#648887,#3f6665
            dist/github-contribution-grid-snake-dark.svg?color_snake=#b4e7d8&color_dots=#1d2121,#2f4a49,#648887,#89b5bc,#b4e7d8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

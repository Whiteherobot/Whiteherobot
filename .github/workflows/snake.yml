name: generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: whiteherobot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FBBF24&color_dots=%23ebedf0,%2399f6e4,%232dd4bf,%2314b8a6,%230f766e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FBBF24&color_dots=%23161b22,%23134e4a,%230f766e,%2314b8a6,%232dd4bf

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
